<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元智大學 YZU 像素風校園導覽</title>
  <!-- 引入像素英文字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="pixel-header">
    <h1>YZU PIXEL CAMPUS</h1>
    <p>點擊地圖上的建築物探索元智校園！</p>
  </header>

  <!-- 地圖主容器 -->
  <main class="map-wrapper">
    <div class="map-container">
      <!-- 你的像素風校園底圖 -->
      <img src="images/yzu-pixel-map.jpg" alt="元智大學像素風地圖" class="pixel-map">

      <!-- 互動熱區按鈕 (座標依照你提供的平面圖比例設定) -->
      <button class="hotspot" style="top: 62%; left: 20%;" data-id="b1">
        <span class="pin">1</span>
        <span class="tooltip">元智一館</span>
      </button>

      <button class="hotspot" style="top: 28%; left: 42%;" data-id="b2">
        <span class="pin">2</span>
        <span class="tooltip">元智二館</span>
      </button>

      <button class="hotspot" style="top: 59%; left: 41%;" data-id="b3">
        <span class="pin">3</span>
        <span class="tooltip">元智三館</span>
      </button>

      <button class="hotspot" style="top: 28%; left: 24%;" data-id="b5">
        <span class="pin">5</span>
        <span class="tooltip">五館 & 圖書館</span>
      </button>

      <button class="hotspot" style="top: 32%; left: 14%;" data-id="b6">
        <span class="pin">6</span>
        <span class="tooltip">元智六館</span>
      </button>

      <button class="hotspot" style="top: 62%; left: 52%;" data-id="b7">
        <span class="pin">7</span>
        <span class="tooltip">元智七館</span>
      </button>

      <button class="hotspot" style="top: 28%; left: 95%;" data-id="dorm">
        <span class="pin">宿</span>
        <span class="tooltip">學生宿舍區</span>
      </button>
    </div>
  </main>

  <!-- RPG 風格建築介紹彈出視窗 -->
  <div id="info-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title">建築名稱</h2>
        <button id="close-btn" class="pixel-btn">X</button>
      </div>
      <div class="modal-body">
        <img id="modal-img" src="" alt="建築照片">
        <p id="modal-desc">這裡會顯示建築物的詳細介紹...</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>






<style id="yzu-danmaku-comment-style">
  .danmaku-layer {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 20;
  }

  .danmaku-item {
    position: absolute;
    left: 100%;
    white-space: nowrap;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    animation: yzuDanmakuFly 8s linear forwards;
  }

  @keyframes yzuDanmakuFly {
    from {
      transform: translateX(0);
    }
    to {
      transform: translateX(calc(-1200px - 100%));
    }
  }

  .yzu-comment-board {
    width: 100%;
    max-width: 1000px;
    margin: 28px auto 40px;
    background-color: #1e272e;
    border: 4px solid #fff;
    box-shadow: 0 0 0 4px #000, 8px 8px 0 4px rgba(0, 0, 0, 0.5);
    padding: 20px;
    color: #fff;
    box-sizing: border-box;
  }

  .yzu-comment-board * {
    box-sizing: border-box;
  }

  .yzu-comment-title {
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 3px solid #fff;
    font-size: 1.05rem;
    color: #f1c40f;
  }

  .yzu-comment-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .yzu-comment-row {
    display: flex;
    gap: 10px;
  }

  .yzu-comment-form input {
    background-color: #2f3640;
    border: 3px solid #fff;
    color: #fff;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
  }

  .yzu-comment-form input:focus {
    border-color: #f1c40f;
  }

  #yzu-nick-input {
    max-width: 240px;
  }

  #yzu-msg-input {
    flex: 1;
    min-width: 0;
  }

  .yzu-send-btn {
    background-color: #2ecc71;
    color: #000;
    border: 3px solid #fff;
    box-shadow: 2px 2px 0 #000;
    padding: 0 16px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }

  .yzu-send-btn:hover {
    background-color: #27ae60;
  }

  .yzu-send-btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }

  .yzu-comment-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .yzu-comment-card {
    display: flex;
    gap: 12px;
    background-color: #2f3640;
    border: 2px solid #7f8fa6;
    padding: 12px 14px;
    align-items: flex-start;
  }

  .yzu-comment-avatar {
    width: 40px;
    height: 40px;
    background-color: #e67e22;
    border: 2px solid #fff;
    box-shadow: 2px 2px 0 #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1rem;
    flex-shrink: 0;
  }

  .yzu-comment-body {
    flex: 1;
    min-width: 0;
  }

  .yzu-comment-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .yzu-comment-author {
    font-size: 0.85rem;
    color: #f1c40f;
    font-weight: bold;
  }

  .yzu-comment-time {
    font-size: 0.75rem;
    color: #a4b0be;
  }

  .yzu-comment-text {
    font-size: 0.92rem;
    line-height: 1.5;
    color: #f5f6fa;
    margin-bottom: 8px;
    word-break: break-word;
  }

  .yzu-like-btn {
    background-color: transparent;
    border: 2px solid #7f8fa6;
    color: #dcdde1;
    padding: 4px 10px;
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .yzu-like-btn:hover {
    border-color: #fff;
    color: #fff;
  }

  .yzu-like-btn.is-liked {
    background-color: #e74c3c;
    border-color: #fff;
    color: #fff;
    box-shadow: 2px 2px 0 #000;
  }
</style>

<section id="yzu-comment-board" class="yzu-comment-board" aria-label="校園留言板">
  <h2 class="yzu-comment-title">校園留言板（<span id="yzu-comment-total">0</span> 則留言）</h2>
  <form id="yzu-comment-form" class="yzu-comment-form">
    <input id="yzu-nick-input" type="text" placeholder="你的暱稱（預設：元智路人）" maxlength="12" />
    <div class="yzu-comment-row">
      <input id="yzu-msg-input" type="text" placeholder="輸入留言，送出後會變成彈幕飛過地圖！" maxlength="60" required />
      <button type="submit" class="yzu-send-btn">發送彈幕</button>
    </div>
  </form>
  <div id="yzu-comment-list" class="yzu-comment-list"></div>
</section>

<script id="yzu-danmaku-comment-script">
  (() => {
    const STORAGE_KEY = "yzu_campus_danmaku_comments_v1";
    const colors = ["#ffffff", "#f1c40f", "#2ecc71", "#00d2d3", "#ff9ff3"];
    const defaults = [
      { id: 1, author: "二館探險家", text: "八角形建築超有辨識度，每次來都想逛逛！", time: "剛剛", likes: 12, liked: false },
      { id: 2, author: "元智同學", text: "像素風地圖配彈幕太好玩了吧！", time: "5 分鐘前", likes: 8, liked: false }
    ];

    // 自動把彈幕圖層塞進地圖容器內，不需手動改原本的 HTML 結構
    const mapContainer = document.querySelector(".map-container") || document.querySelector(".map-wrapper") || document.body;
    let danmakuLayer = document.getElementById("danmaku-layer");
    if (!danmakuLayer) {
      danmakuLayer = document.createElement("div");
      danmakuLayer.id = "danmaku-layer";
      danmakuLayer.className = "danmaku-layer";
      mapContainer.appendChild(danmakuLayer);
    }

    const form = document.getElementById("yzu-comment-form");
    const nickInput = document.getElementById("yzu-nick-input");
    const msgInput = document.getElementById("yzu-msg-input");
    const listEl = document.getElementById("yzu-comment-list");
    const totalEl = document.getElementById("yzu-comment-total");

    let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || defaults;

    function escapeText(str) {
      return String(str).replace(/[&<>'"]/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
      }[ch]));
    }

    function shootDanmaku(text) {
      const el = document.createElement("div");
      el.className = "danmaku-item";
      el.textContent = text;
      el.style.top = `${Math.floor(Math.random() * 68) + 8}%`;
      el.style.color = colors[Math.floor(Math.random() * colors.length)];
      danmakuLayer.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    function render() {
      totalEl.textContent = items.length;
      listEl.innerHTML = items.map((item) => {
        const initial = escapeText((item.author || "元").trim().charAt(0).toUpperCase());
        return `
          <article class="yzu-comment-card">
            <div class="yzu-comment-avatar">${initial}</div>
            <div class="yzu-comment-body">
              <div class="yzu-comment-meta">
                <span class="yzu-comment-author">${escapeText(item.author)}</span>
                <span class="yzu-comment-time">${escapeText(item.time)}</span>
              </div>
              <div class="yzu-comment-text">${escapeText(item.text)}</div>
              <button type="button" class="yzu-like-btn ${item.liked ? "is-liked" : ""}" data-like-id="${item.id}">
                👍 <span>${item.likes}</span>
              </button>
            </div>
          </article>
        `;
      }).join("");

      listEl.querySelectorAll("[data-like-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = Number(btn.getAttribute("data-like-id"));
          items = items.map((c) => c.id === id
            ? { ...c, liked: !c.liked, likes: c.liked ? c.likes - 1 : c.likes + 1 }
            : c
          );
          save();
          render();
        });
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      const author = nickInput.value.trim() || "元智路人";

      shootDanmaku(text);
      items.unshift({
        id: Date.now(),
        author,
        text,
        time: "剛剛",
        likes: 0,
        liked: false
      });
      save();
      render();
      msgInput.value = "";
    });

    render();
    if (items[0]) {
      setTimeout(() => shootDanmaku(items[0].text), 600);
    }
  })();
</script>
</body>
